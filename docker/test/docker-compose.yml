#
# hawkBit 1.x with its in-memory database: every "docker compose up" starts empty and the
# seed service fills it with the data the tests expect (see seed.sh).
services:

  update-server:
    image: hawkbit/hawkbit-update-server:1.1.0
    volumes:
      - ./application.properties:/app/config/application.properties:ro
    ports:
      - 8080:8080
    networks:
      - hara-network

  # ------------------------------------------------

  seed:
    image: curlimages/curl:8.16.0
    entrypoint: ["sh", "/seed.sh"]
    environment:
      - HAWKBIT_URL=http://update-server:8080
    volumes:
      - ./seed.sh:/seed.sh:ro
      - ./artifactrepo/DEFAULT:/fixtures:ro
    networks:
      - hara-network
    depends_on:
      - update-server

  # ------------------------------------------------
networks:
  hara-network:
