# hawkBit 1.x configuration for the integration tests. It must be a mounted file:
# the image's "sh -c" entrypoint mangles command-line arguments with brackets.

# Management API user of the DEFAULT tenant, created on its first call
hawkbit.security.user[test].tenant=DEFAULT
hawkbit.security.user[test].password={noop}test
hawkbit.security.user[test].roles=TENANT_ADMIN
hawkbit.server.repository.implicitTenantCreateAllowed=true

# The tests set polling times down to 5 seconds
hawkbit.controller.minPollingTime=00:00:01
