name: build-action
on:
    push:
      branches-ignore:
        - 'gh-pages'
    pull_request:
      branches-ignore:
        - 'gh-pages'

jobs:
    build:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-15-intel, windows-latest]
        runs-on: ${{matrix.os}}
        steps:
        - name: Check repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
          with:
            cache-provider: basic

        #Run only on macOS
        - name: Setup Docker on macOS
          if: ${{ matrix.os == 'macos-15-intel' && github.event_name == 'pull_request' }}
          uses: douglascamata/setup-docker-macos-action@d5ccc6aae0ce23e7700154f5e63cc53e6433ac48 # v1.1.0

        - name: Set up JDK 17
          uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
          with:
            distribution: 'temurin'
            java-version: 17

        - name: Cache SonarQube packages
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
            path: ~/.sonar/cache
            key: ${{ runner.os }}-sonar
            restore-keys: ${{ runner.os }}-sonar

        - name: Cache Gradle packages
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
            path: ~/.gradle/caches
            key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
            restore-keys: ${{ runner.os }}-gradle

        #Build without test on Windows or macOS (when not a PR)
        - name: Gradle build
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_CLOUD_ORGANIZATION: ${{ vars.SONAR_CLOUD_ORGANIZATION }}
            SONAR_CLOUD_PROJECT_KEY: ${{ vars.SONAR_CLOUD_PROJECT_KEY }}
            SONAR_CLOUD_PROJECT_NAME: ${{ vars.SONAR_CLOUD_PROJECT_NAME }}
          run: |
              if [[ "$RUNNER_OS" == "Windows" || ( "$RUNNER_OS" == "macOS" && ${{ github.event_name }} != 'pull_request' ) ]]; then
                  ./gradlew build -x test
              elif [[ ${{ github.event_name }} == 'pull_request' && ${{ github.event.pull_request.head.repo.full_name != 'eclipse-hara/hara-ddiclient' }} == true ]]; then
                  ./gradlew --info build
              elif [[ -z "$SONAR_CLOUD_ORGANIZATION" ]]; then
                  ./gradlew --info build
              else
                  ./gradlew --info build sonar
              fi
          shell: bash

